[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosine_is_human"
version = "0.1.0"
description = "Reproducibility package for 'Cosine is Nearly Human: The Reproducibility Ceiling of Perceptual Similarity'"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Benjamin ten Wolde", email = "benjaminltenwolde@gmail.com" }]
keywords = ["perceptual similarity", "NIGHTS", "DreamSim", "DINO", "LPIPS", "reproducibility ceiling"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
cih = "cosine_is_human.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
